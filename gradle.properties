org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Android Studio JBR may ship a newer Java than Gradle/AGP support.
# Project compiles with Java 17 — Microsoft OpenJDK 17 (winget: Microsoft.OpenJDK.17)
org.gradle.java.home=C\:\\Program Files\\Microsoft\\jdk-17.0.20.8-hotspot
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build speed: run independent modules in parallel, keep the daemon warm
# between builds, and cache task outputs so unchanged tasks are skipped.
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
# Configuration cache: speeds up the configuration phase on repeat builds.
# If a build fails right after enabling this with an opaque
# serialization/task-graph error, it's almost always this flag - AGP's
# config-cache support has occasional gaps - so delete this line (or set
# it to false) and retry before assuming something else broke.
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
